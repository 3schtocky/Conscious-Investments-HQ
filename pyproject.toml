[project]
name = "hq"
version = "0.1.0"
description = "Conscious Investments HQ: an AI-run stock-picking office"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "erb",
    "fastapi>=0.115",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hq = "hq.cli:main"

[tool.uv.sources]
erb = { path = "Equity Research", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hq"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
